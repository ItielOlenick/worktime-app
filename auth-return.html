<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Back to Worktime</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f3; --text: #1b1d22; --muted: #5d6270; --accent: #2a78d6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --text: #eceef2; --muted: #a0a6b3; --accent: #5b9ee8; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
      main { text-align: center; padding: 24px 16px; max-width: 360px; }
      h1 { font-size: 1.3rem; margin: 12px 0 4px; }
      p { color: var(--muted); margin: 0 0 20px; }
      a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="" width="56" height="56" />
      <h1 id="title">Back to Worktime</h1>
      <p id="text">Opening the Worktime app…</p>
      <a id="open" href="#">Open Worktime</a>
    </main>
    <script src="auth-return.js"></script>
  </body>
</html>
